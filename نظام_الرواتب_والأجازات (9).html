<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الرواتب والأجازات — إدارة الشركات</title>
<style>
:root{
  --primary:#2563eb; --primary-d:#1d4ed8; --bg:#f1f5f9; --card:#ffffff;
  --text:#1e293b; --muted:#64748b; --border:#e2e8f0; --green:#16a34a;
  --red:#dc2626; --amber:#d97706; --shadow:0 1px 3px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:#0f172a;color:#cbd5e1;padding:20px 0;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden}
#sideNav{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.brand{padding:0 20px 20px;font-size:20px;font-weight:700;color:#fff;border-bottom:1px solid #1e293b;margin-bottom:14px}
.brand span{color:#60a5fa}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 20px;cursor:pointer;transition:.2s;font-size:15px;flex:1 1 0;min-height:0}
.nav-item:hover{background:#1e293b;color:#fff}
.nav-item.active{background:var(--primary);color:#fff;border-right:4px solid #93c5fd}
.nav-item .ico{font-size:18px}
.main{flex:1;padding:26px 32px;overflow-x:auto}
.page-title{font-size:24px;font-weight:700;margin-bottom:6px}
.page-sub{color:var(--muted);margin-bottom:22px;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:26px}
.card{background:var(--card);border-radius:14px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card .label{color:var(--muted);font-size:13px;margin-bottom:8px}
.card .value{font-size:26px;font-weight:700}
.card .value.green{color:var(--green)} .card .value.red{color:var(--red)} .card .value.blue{color:var(--primary)}
.panel{background:var(--card);border-radius:14px;padding:22px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:22px}
.panel h3{font-size:17px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 10px;text-align:right;border-bottom:1px solid var(--border)}
th{background:#f8fafc;color:var(--muted);font-weight:600;font-size:13px}
tr:hover td{background:#f8fafc}
.btn{border:none;border-radius:9px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff} .btn-primary:hover{background:var(--primary-d)}
.btn-green{background:var(--green);color:#fff} .btn-green:hover{filter:brightness(.92)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-light{background:#f1f5f9;color:var(--text)} .btn-light:hover{background:#e2e8f0}
.btn-danger{background:#fee2e2;color:var(--red)} .btn-danger:hover{background:#fecaca}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;font-size:14px;font-family:inherit;background:#fff}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-green{background:#dcfce7;color:var(--green)} .badge-red{background:#fee2e2;color:var(--red)}
.badge-amber{background:#fef3c7;color:var(--amber)} .badge-blue{background:#dbeafe;color:var(--primary)}
.page{display:none} .page.active{display:block}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar input,.toolbar select{padding:9px 12px;border:1px solid var(--border);border-radius:9px;font-family:inherit;font-size:14px}
.toolbar .spacer{flex:1}
.empty{text-align:center;padding:40px;color:var(--muted)}
.empty .ico{font-size:40px;display:block;margin-bottom:10px;opacity:.5}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.modal h3{margin-bottom:18px}
.modal-actions{display:flex;gap:10px;justify-content:flex-start;margin-top:22px}
.cloud-chip{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;margin-inline-start:8px;border:1px solid transparent}
.cloud-chip.on{background:#dcfce7;color:#15803d;border-color:#bbf7d0}
.cloud-chip.off{background:#f1f5f9;color:#64748b;border-color:#e2e8f0}
.cloud-chip.wait{background:#fef3c7;color:#b45309;border-color:#fde68a}
.cloud-chip.bad{background:#fee2e2;color:#dc2626;border-color:#fecaca}
.cloud-msg{margin-top:10px;font-size:13px;font-weight:700;padding:9px 12px;border-radius:9px;display:none;line-height:1.7}
.cloud-msg.ok{display:block;background:#dcfce7;color:#15803d}
.cloud-msg.bad{display:block;background:#fee2e2;color:#dc2626}
.cloud-msg.wait{display:block;background:#fef3c7;color:#b45309}
body.dark-mode .cloud-chip.off{background:#0f172a;color:#94a3b8;border-color:#334155}
body.dark-mode .cloud-msg.ok{background:#052e16;color:#4ade80}
body.dark-mode .cloud-msg.bad{background:#450a0a;color:#fca5a5}
body.dark-mode .cloud-msg.wait{background:#422006;color:#fcd34d}
.toast{position:fixed;bottom:24px;left:24px;background:#0f172a;color:#fff;padding:13px 20px;border-radius:10px;font-size:14px;z-index:100;opacity:0;transform:translateY(20px);transition:.3s;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateY(0)}
.progress{height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin-top:6px}
.progress .bar{height:100%;background:var(--green);border-radius:10px;transition:.4s}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
/* ─── الوضع الليلي ─── */
.theme-toggle{margin:14px 16px 0;padding:10px 14px;border-radius:10px;background:#1e293b;color:#cbd5e1;border:none;cursor:pointer;font-family:inherit;font-size:14px;width:calc(100% - 32px);display:flex;align-items:center;gap:8px;justify-content:center;transition:.2s}
.theme-toggle:hover{background:#334155;color:#fff}
body.dark-mode{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--border:#334155}
body.dark-mode th{background:#0f172a;color:#94a3b8}
body.dark-mode tr:hover td{background:#273449}
body.dark-mode .field input,body.dark-mode .field select,body.dark-mode .toolbar input,body.dark-mode .toolbar select{background:#0f172a;color:#e2e8f0;border-color:#334155}
body.dark-mode .btn-light{background:#334155;color:#e2e8f0}
body.dark-mode .btn-light:hover{background:#475569}
body.dark-mode .modal{background:#1e293b}
body.dark-mode .theme-toggle{background:#334155;color:#fbbf24}
body.dark-mode tfoot tr,body.dark-mode tr[style*="f8fafc"]{background:#0f172a !important}
body.dark-mode .card .value:not(.green):not(.red):not(.blue){color:#e2e8f0}
/* ─── شريط الأماكن ─── */
.brandbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#0f172a;color:#e2e8f0;padding:8px 14px;position:sticky;top:0;z-index:30;border-bottom:1px solid #1e293b}
.brandbar .bb-title{font-weight:700;color:#fff;font-size:15px;white-space:nowrap}
.brandbar .bb-ico{font-size:16px}
.bb-left{display:flex;align-items:center;gap:8px;flex:1;min-width:220px}
.bb-left select{background:#1e293b;color:#fff;border:1px solid #334155;border-radius:9px;padding:8px 12px;font-family:inherit;font-size:14px;font-weight:600;min-width:200px;max-width:340px}
.bb-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* ─── الطباعة ─── */
.noprint{}
@media print{.brandbar,.sidebar,.toolbar .btn,.noprint{display:none !important}.main{padding:0}}
@media(max-width:800px){.brandbar .bb-right .btn{padding:6px 10px;font-size:12px}.brandbar .bb-title{display:none}}
@media(max-width:800px){.sidebar{width:64px}.brand{font-size:0;padding:0 0 14px}.nav-item span:not(.ico){display:none}.nav-item{justify-content:center}.main{padding:18px}}
/* ─── شاشة تسجيل الدخول ─── */
#loginScreen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#1e293b 55%,#0f172a 100%);padding:20px;overflow:auto}
#loginScreen.hidden{display:none}
.login-box{background:#fff;border-radius:18px;padding:32px 30px;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.45);text-align:center}
.login-box .lg-brand{font-size:26px;font-weight:700;color:#1e293b;margin-bottom:4px}
.login-box .lg-brand span{color:#2563eb}
.login-box .lg-sub{color:#64748b;font-size:13px;margin-bottom:24px}
.login-box .field{text-align:right;margin-bottom:14px}
.login-box .field label{display:block;font-size:13px;color:#64748b;margin-bottom:6px;font-weight:600}
.login-box .field input{width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
.login-box .field input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.login-box .btn-lg{width:100%;padding:13px;font-size:16px;border-radius:11px;margin-top:8px}
.login-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 6px;text-align:right}
.remember{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;color:#334155;font-weight:600;user-select:none}
.remember input{width:18px;height:18px;accent-color:#2563eb;cursor:pointer;margin:0}
.remember .lbl{line-height:1}
.show-pass{background:none;border:none;color:#2563eb;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;padding:4px 2px}
.show-pass:hover{text-decoration:underline}
body.dark-mode .remember{color:#cbd5e1}
body.dark-mode .show-pass{color:#60a5fa}
.login-err{background:#fee2e2;color:#dc2626;font-size:13px;padding:9px 12px;border-radius:9px;margin-bottom:12px;display:none;font-weight:600}
.login-err.show{display:block}
.login-foot{margin-top:20px;font-size:12px;color:#94a3b8;line-height:1.7}
.rl-note{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;font-size:12.5px;padding:10px 12px;border-radius:10px;margin-bottom:16px;line-height:1.7;text-align:right}
.rl-meta{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px}
.rl-badge{background:#dbeafe;color:#1e40af;font-weight:700;font-size:12px;padding:5px 12px;border-radius:20px}
.rl-ok{text-align:center;padding:6px 0}
.rl-ok .ic{font-size:44px;line-height:1;margin-bottom:10px}
.rl-ok h2{font-size:19px;color:#15803d;margin:0 0 8px}
.rl-ok p{color:#64748b;font-size:13px;line-height:1.9;margin:0}
body.dark-mode .rl-note{background:#0f2a44;border-color:#1d4ed8;color:#bfdbfe}
body.dark-mode .rl-ok h2{color:#4ade80}
body.dark-mode .rl-ok p{color:#cbd5e1}
.lnk-box{display:flex;gap:6px;align-items:center;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:6px 8px;margin-top:6px}
.lnk-box input{flex:1;border:none;background:transparent;font-size:12px;color:#334155;font-family:inherit;direction:ltr;text-align:left;min-width:0}
.lnk-box input:focus{outline:none}
body.dark-mode .lnk-box{background:#0f172a;border-color:#334155}
body.dark-mode .lnk-box input{color:#cbd5e1}
.login-foot code{background:#f1f5f9;color:#1e293b;padding:1px 6px;border-radius:5px;font-weight:600}
.role-tag{position:absolute;top:14px;left:16px;background:rgba(255,255,255,.15);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600}
/* ─── تبويب الحضور ─── */
.att-clock{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px;color:var(--primary);line-height:1.2}
.att-clock .sec{font-size:22px;color:var(--muted)}
.att-date{color:var(--muted);font-size:14px;margin-bottom:18px}
.att-big{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.att-big .btn{flex:1;min-width:190px;padding:20px;font-size:18px;border-radius:14px}
.gps-chip{display:inline-flex;align-items:center;gap:8px;background:#f1f5f9;border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-size:13px;margin:4px 0}
.gps-chip.ok{background:#dcfce7;border-color:#bbf7d0;color:var(--green)}
.gps-chip.bad{background:#fee2e2;border-color:#fecaca;color:var(--red)}
.gps-chip.wait{background:#fef3c7;border-color:#fde68a;color:var(--amber)}
.side-user{display:flex;align-items:center;gap:10px;margin:0 16px 14px;padding:11px 12px;border-radius:11px;background:#1e293b;color:#cbd5e1;font-size:13px;flex-wrap:wrap}
.side-user .who{font-weight:700;color:#fff}
.side-user .btn{padding:4px 10px;font-size:12px;margin-inline-start:auto}
body.dark-mode #loginScreen{background:linear-gradient(135deg,#020617 0%,#0f172a 55%,#020617 100%)}
body.dark-mode .login-box{background:#1e293b}
body.dark-mode .login-box .lg-brand{color:#e2e8f0}
body.dark-mode .login-box .field input{background:#0f172a;color:#e2e8f0;border-color:#334155}
body.dark-mode .login-foot code{background:#334155;color:#e2e8f0}
body.dark-mode .gps-chip{background:#0f172a;border-color:#334155}
/* ════════════ 📱 تحسينات الجوال ════════════ */
@media(max-width:820px){
  /* نلغي القائمة الجانبية العمودية وبنستبدلها بتبويب سفلي للتنقل */
  .sidebar{display:none !important}
  .app{display:block}
  .main{padding:12px 12px 84px;overflow-x:hidden}
  /* شريط الأماكن أعلى الشاشة يبقى مضغوط وبيّن */
  .brandbar{padding:7px 10px;gap:6px;flex-wrap:nowrap;overflow:visible}
  .bb-left{min-width:0;flex:1;gap:6px}
  .bb-left select{min-width:0;max-width:none;width:100%;padding:7px 9px;font-size:13px}
  .bb-right{gap:5px;flex-shrink:0}
  .bb-right .btn{padding:6px 9px;font-size:12px;white-space:nowrap}
  .bb-title{display:none}
  /* عناوين وكروت مضغوطة */
  .page-title{font-size:19px;margin-bottom:4px}
  .page-sub{font-size:12.5px;margin-bottom:14px}
  .panel{padding:14px;border-radius:12px;margin-bottom:14px}
  .panel h3{font-size:15.5px;margin-bottom:12px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
  .card{padding:14px;border-radius:12px}
  .card .value{font-size:21px}
  .card .label{font-size:12px}
  .form-grid{grid-template-columns:1fr !important;gap:12px}
  .toolbar{gap:8px}
  .toolbar input,.toolbar select{flex:1;min-width:0;font-size:13px;padding:8px 10px}
  .toolbar .btn{padding:8px 12px;font-size:13px}
  /* الأزرار العامة أصغر عشان ما تزحمش */
  .btn{padding:9px 14px;font-size:13.5px}
  .btn-sm{padding:6px 10px;font-size:12px}
  /* الجداول تبقى scroll أفقي أنيق أو تتحول لكروت */
  .panel table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;font-size:13px}
  .panel table th,.panel table td{padding:9px 8px}
  /* ── تبويب الموظف (الحضور) على الجوال ── */
  .att-clock{font-size:56px;line-height:1.05}
  .att-clock .sec{font-size:28px}
  .att-date{font-size:13px;margin-bottom:14px}
  .att-big{gap:10px;margin-bottom:14px !important}
  .att-big .btn{min-width:100%;padding:22px 16px;font-size:19px;border-radius:16px}
  .gps-chip{font-size:12.5px;padding:7px 12px;line-height:1.5}
  .side-user{display:none}
  /* قوائم منسدلة وستايل الزجاج */
  select,input[type=text],input[type=password],input[type=number],input[type=time],input[type=date],input[type=month]{font-size:15px}
}
/* شريط التنقل السفلي (جوال) */
.mobnav{display:none}
@media(max-width:820px){
  .mobnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:60;background:#0f172a;border-top:1px solid #1e293b;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;align-items:stretch;box-shadow:0 -6px 20px rgba(0,0,0,.28)}
  .mobnav .mni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:10px;color:#94a3b8;font-size:10.5px;font-weight:600;cursor:pointer;transition:.15s;text-align:center;line-height:1.15}
  .mobnav .mni .ic{font-size:19px;line-height:1}
  .mobnav .mni.active{background:var(--primary);color:#fff}
  .mobnav .mni:active{background:#1e293b}
  .mobuser{display:none}
  .mobuser.show{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:10px 12px;border-radius:11px;background:#0f172a;color:#cbd5e1;font-size:13px}
  .mobuser .who{font-weight:700;color:#fff}
  .mobuser .btn{padding:5px 10px;font-size:12px;margin-inline-start:auto}
}
</style>
</head>
<body>
<!-- ═══ شاشة تسجيل الدخول ═══ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="lg-brand">نظام <span>الرواتب</span></div>
    <div class="lg-sub">سجّل الدخول للمتابعة</div>
    <div class="login-err" id="loginErr"></div>
    <form id="loginForm" onsubmit="doLogin(event);return false;">
      <div class="field"><label>اسم المستخدم</label><input id="loginUser" autocomplete="username" placeholder="اسم المستخدم" required></div>
      <div class="field"><label>كلمة السر</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••" required></div>
      <div class="login-row">
        <label class="remember" title="احفظ اسم المستخدم عشان يتملّى أوتوماتيك المرة الجاية">
          <input type="checkbox" id="loginRemember"><span class="lbl">تذكّرني</span>
        </label>
        <button type="button" class="show-pass" id="loginShowPass" onclick="toggleShowPass()">👁 إظهار</button>
      </div>
      <button class="btn btn-primary btn-lg" type="submit" id="loginBtn">🔓 دخول</button>
    </form>
    <div class="login-foot">اكتب <b>الإيميل</b> (اسم المستخدم) وكلمة السر. لو نسيت كلمة السر اطلب من مدير النظام رابط تعيين جديد.</div>
  </div>
</div>
<!-- ═══ شاشة إعادة تعيين كلمة السر (من رابط المرسول للموظف) ═══ -->
<div id="resetScreen" style="display:none">
  <div class="login-box">
    <div class="lg-brand">نظام <span>الرواتب</span></div>
    <div class="lg-sub">تعيين كلمة سر خاصة بك</div>
    <div id="resetBody"></div>
  </div>
</div>
<div class="brandbar" id="branchBar"></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">نظام <span>الرواتب</span><div style="font-size:11px;font-weight:400;color:#94a3b8;margin-top:2px">إدارة الشركات / الأماكن</div></div>
    <div class="side-user" id="sideUser"></div>
    <nav id="sideNav"></nav>
    <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()"><span id="themeIco">🌙</span><span id="themeTxt">الوضع الليلي</span></button>
  </aside>
  <main class="main" id="main"><div class="mobuser" id="mobUser"></div></main>
</div>
<!-- شريط التنقل السفلي للجوال -->
<nav class="mobnav" id="mobNav"></nav>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
/* supabase-js v2.119.0 — مكتبة العميل للسحابة (UMD self-contained مدمجة، تعمل بملف واحد بدون CDN) */
/**
 * Skipped minification because the original files appears to be already minified.

<script>
/* ===== التخزين (نظام متعدد الشركات/الأماكن) ===== */
const DB_KEY='payroll_sys_v3';
/* حساب المالك الافتراضي (يتغير من الإعدادات) */
function ownerDefault(){return {username:'omarfix26@gmail.com',password:'Omar@1701'};}
/* إعدادات العمل الافتراضية: وقت البداية/النهاية + النطاق + أيام العمل (0=الأحد ... 6=السبت) */
function workDefault(){return {start:'09:00',end:'17:00',graceLate:15,otAfter:0,days:[0,1,2,3,4]};}
/* إعدادات الموقع الجغرافي (GPS) للمكان */
function siteDefault(){return {lat:null,lng:null,radius:150,label:''};}
/* كل شركة/مكان مستقل تمامًا ببياناته وترقيمه الخاص */
function newBranch(name){return {id:'b'+Date.now()+Math.random().toString(36).slice(2,7),name:name||'شركة جديدة',createdAt:new Date().toISOString(),seq:1,lseq:100,settings:{annualLeave:21,workDays:30},site:siteDefault(),work:workDefault(),att:{seq:1,rows:[]},emps:[]};}
let db=load();
let state=curState();
function curState(){return db.branches.find(b=>b.id===db.active)||db.branches[0];}
function syncState(){state=curState();if(state)ensureBranchShape(state);}
function ensureBranchShape(b){if(!b)return;if(!b.emps)b.emps=[];if(b.seq==null)b.seq=1;if(b.lseq==null)b.lseq=100;if(!b.settings)b.settings={annualLeave:21,workDays:30};if(!b.settings.absDeduct)b.settings.absDeduct={on:true,base:'gross',days:30};if(!b.site)b.site=siteDefault();else{const s=siteDefault();Object.keys(s).forEach(k=>{if(b.site[k]===undefined)b.site[k]=s[k];});}if(!b.work)b.work=workDefault();else{const w=workDefault();Object.keys(w).forEach(k=>{if(b.work[k]===undefined)b.work[k]=w[k];});}if(!b.att)b.att={seq:1,rows:[]};if(!Array.isArray(b.att.rows))b.att.rows=[];if(b.att.seq==null)b.att.seq=1;}
function ensureUserShape(e){if(!e)return;if(e.username==null)e.username='';if(e.password==null)e.password='';if(!e.work){e.work=workDefault();}else{const w=workDefault();Object.keys(w).forEach(k=>{if(e.work[k]===undefined)e.work[k]=w[k];});}if(e.allowManualLoc==null)e.allowManualLoc=false;}
function ensureDBShape(){if(!db.owner||!db.owner.username)db.owner=ownerDefault();
  /* هجرة لمرة واحدة: تغيير بيانات المالك الافتراضية القديمة للجديدة */
  if(db.owner&&db.owner.username==='admin'&&(db.owner.password==='admin'||!db.owner.pwdHash))db.owner=ownerDefault();
  if(db.owner&&db.owner.password){if(!db.owner.pwdHash)db.owner.pwdHash=makePwdHash(db.owner.password);delete db.owner.password;}
  if(!db.session)db.session=null;
  ensureResetShape();}
function freshDB(){return {v:4,active:null,branches:[],lseq:100,aseq:null,owner:ownerDefault(),session:null};}
function load(){
  let r;try{r=JSON.parse(localStorage.getItem(DB_KEY));}catch(e){}
  if(!r)r=null;
  if(!r){ // هجرة تلقائية من النسخة القديمة أحادية الشركة
    let old=null;try{old=JSON.parse(localStorage.getItem('payroll_sys_v2'));}catch(e){}
    const nb=newBranch('الشركة الرئيسية');
    if(old&&old.emps&&old.emps.length){nb.emps=migrate(old).emps||[];nb.seq=old.seq||(nb.emps.length+1);nb.lseq=old.lseq||100;if(old.settings)nb.settings=old.settings;}
    const f=freshDB();f.branches=[nb];f.active=nb.id;return f;
  }
  return upgradeDB(r);
}
function upgradeDB(r){
  if(!r.owner||!r.owner.username)r.owner=ownerDefault();if(r.session===undefined)r.session=null;
  if(r.branches&&Array.isArray(r.branches)){ // صيغة جديدة
    r.branches.forEach(b=>{ensureBranchShape(b);migrate(b);});
    if(!r.branches.length){const nb=newBranch('الشركة الرئيسية');r.branches=[nb];}
    if(!r.active||!r.branches.find(b=>b.id===r.active))r.active=r.branches[0].id;
    return r;
  }
  // صيغة وسيطة: كائن شركة واحدة بدون مصفوفة فروع
  const nb=newBranch('الشركة الرئيسية');
  nb.emps=migrate(r).emps||[];nb.seq=r.seq||(nb.emps.length+1);nb.lseq=r.lseq||100;if(r.settings)nb.settings=r.settings;
  const f=freshDB();f.branches=[nb];f.active=nb.id;return f;
}
function migrate(s){
  (s.emps||[]).forEach(e=>{
    ensureUserShape(e);
    if(e.costCenter==null)e.costCenter='';
    if(e.insuranceRate==null)e.insuranceRate=0;
    if(e.endDate==null)e.endDate='';
    if(e.nationality==null)e.nationality='';
    if(e.residencyNo==null)e.residencyNo='';
    if(e.residencyExp==null)e.residencyExp='';
    if(e.startDate==null)e.startDate=e.hire||'';
    if(!Array.isArray(e.additions))e.additions=[];
    if(!e.aseq)e.aseq=100;
    if(!Array.isArray(e.deducts))e.deducts=[];
    if(!e.dseq)e.dseq=100;
    if(!Array.isArray(e.claims))e.claims=[];
    if(!e.cseq)e.cseq=100;
    if(e.paid==null)e.paid=0;
    if(!Array.isArray(e.payments)){
      e.payments=[];
      if(+e.paid>0){e.payments.push({id:1,date:'',amount:+e.paid,note:'دفعة سابقة'});}
    }
    delete e.paid;
    if(!e.pseq)e.pseq=100;
    if(!Array.isArray(e.leaves)){
      e.leaves=[];
      // تحويل الرصيد القديم (used) إلى سجل أجازة واحد إن وجد
      if(+e.used>0){e.leaves.push({id:1,start:'',end:'',back:'',days:+e.used,note:'رصيد سابق'});}
    }
    delete e.used;
  });
  if(!s.lseq)s.lseq=100;
  return s;
}
/* ===== إدارة الشركات/الأماكن ===== */
function branches(){return db.branches;}
function activeBranch(){return state;}
function setBranch(id){const b=db.branches.find(x=>x.id===id);if(!b)return;db.active=id;syncState();saveStores();current='dash';render();toast('تم التبديل إلى: '+b.name);}
function saveStores(){localStorage.setItem(DB_KEY,JSON.stringify(db));autoBackupMaybe();if(typeof cloudSchedulePush==='function')cloudSchedulePush();}
function save(){saveStores();}
function addBranch(){openBranchModal(null);}
function editBranch(id){openBranchModal(id);}
function openBranchModal(id){
  const b=id?db.branches.find(x=>x.id===id):null;
  $('#modal').innerHTML=`<h3>${b?'✏️ تعديل':'🏢 إضافة'} مكان / شركة</h3>
  <form id="brF" onsubmit="return saveBranch(event,${b?`'${b.id}'`:'null'})">
    <div class="form-grid">
      <div class="field" style="grid-column:1/-1"><label>اسم المكان / الشركة *</label><input name="name" required value="${b?esc(b.name):''}" placeholder="مثال: فرع الرياض / شركة النور"></div>
      <div class="field"><label>هوية / رقم السجل (اختياري)</label><input name="tax" value="${b?esc(b.tax||''):''}" placeholder="الرقم الضريبي أو السجل التجاري"></div>
      <div class="field"><label>ملاحظة (اختياري)</label><input name="note" value="${b?esc(b.note||''):''}" placeholder="مثال: فرع فرعي / مقر رئيسي"></div>
      <div class="field"><label>معدل الأجازة السنوي الافتراضي (يوم/سنة)</label><input type="number" name="annualLeave" min="0" value="${b?(b.settings&&b.settings.annualLeave)||21:21}"></div>
      <div class="field" style="grid-column:1/-1;border-top:1px dashed var(--border);padding-top:12px"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" name="absOn" ${(()=>{const c=(b&&b.settings&&b.settings.absDeduct)||{};return c.on!==false;})()?'checked':''} style="width:auto"> خصم الغياب تلقائيًا من الراتب</label><div class="hint">يُخصم عن كل يوم غياب غير مبرّر = (الراتب ÷ أيام الشهر). الغياب بعذر لا يُخصم.</div></div>
      <div class="field"><label>أساس حساب خصم الغياب</label><select name="absBase"><option value="gross" ${(()=>{const c=(b&&b.settings&&b.settings.absDeduct)||{};return c.base!=='basic';})()?'selected':''}>الراتب الإجمالي (أساسي+بدلات)</option><option value="basic" ${(()=>{const c=(b&&b.settings&&b.settings.absDeduct)||{};return c.base==='basic';})()?'selected':''}>الراتب الأساسي فقط</option></select></div>
      <div class="field"><label>عدد أيام الشهر (لقسمة قيمة اليوم)</label><input type="number" name="absDays" min="1" max="31" value="${(()=>{const c=(b&&b.settings&&b.settings.absDeduct)||{};return (+c.days>0?+c.days:30);})()}"></div>
    </div>
  </div>
  <div class="panel" style="box-shadow:none;border:1px solid var(--border);padding:16px"><h3 style="font-size:15px;margin-bottom:12px">📍 موقع الحضور والانصراف (GPS)</h3>
    <div class="form-grid">
      <div class="field"><label>خط العرض (Latitude)</label><input name="lat" id="siteLat" type="number" step="any" value="${b&&b.site&&b.site.lat!=null?b.site.lat:''}" placeholder="مثال: 24.7136"></div>
      <div class="field"><label>خط الطول (Longitude)</label><input name="lng" id="siteLng" type="number" step="any" value="${b&&b.site&&b.site.lng!=null?b.site.lng:''}" placeholder="مثال: 46.6753"></div>

/* seed() اتشالت — بقى في newBranch() لكل مكان مستقل */
/* ===== أدوات ===== */
const $=s=>document.querySelector(s);
function money(n){return (Number(n)||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}
function gross(e){return (+e.basic||0)+(+e.housing||0)+(+e.transport||0)+(+e.other||0);}
/* التأمينات: لو اتحددت نسبة (insuranceRate) تُحسب كنسبة من إجمالي الراتب، وإلا يُستخدم المبلغ الثابت */
function insRate(e){return +e.insuranceRate||0;}
function insAmount(e){const r=insRate(e);return r>0 ? gross(e)*r/100 : (+e.insurance||0);}
function deductions(e){return insAmount(e)+(+e.deductFixed||0);}
function net(e){return gross(e)-deductions(e);}
function usedDays(e){return (e.leaves||[]).reduce((s,l)=>s+(+l.days||0),0);}
function paidTotal(e){return (e.payments||[]).reduce((s,p)=>s+(+p.amount||0),0);}
/* شهر الراتب الذي تخصه الدفعة (مستقل عن تاريخ الدفع الفعلي) — مع توافق رجعي للدفعات القديمة */
function payYM(p){return p.ym||(p.date||'').slice(0,7);}
function paidInMonth(e,ym){if(!ym)return paidTotal(e);return (e.payments||[]).filter(p=>payYM(p)===ym).reduce((s,p)=>s+(+p.amount||0),0);}
/* الخصومات الشهرية الإضافية (مرتبطة بشهر معيّن) */
function monthDeducts(e,ym){if(!ym)return (e.deducts||[]).reduce((s,d)=>s+(+d.amount||0),0);return (e.deducts||[]).filter(d=>d.ym===ym).reduce((s,d)=>s+(+d.amount||0),0);}
/* ═══ خصم الغياب التلقائي حسب الراتب المسجل ═══ */
/* فرع الموظف (يراعي وضع عرض كل الأماكن عبر _bid) */
function branchForEmp(e){if(e&&e._bid)return (db.branches||[]).find(b=>b.id===e._bid)||state;return state;}
/* إعدادات خصم الغياب للفرع (مع قيم افتراضية) */
function absDeductCfg(b){const s=b||state;const c=(s&&s.settings&&s.settings.absDeduct)||{};return {on:c.on!==false,base:c.base==='basic'?'basic':'gross',days:(+c.days>0?+c.days:30)};}
/* عدد أيام الغياب غير المبرّرة للموظف في شهر معين (يتجاهل الغياب بعذر) */
function absDaysMonth(e,ym){if(!ym)return 0;const b=branchForEmp(e);const rows=(b&&b.att&&b.att.rows)||[];const set=new Set();rows.forEach(r=>{if(r.eid!==e.id)return;if(!r.absent||r.excuse)return;if((r.date||'').slice(0,7)!==ym)return;set.add(r.date);});return set.size;}
/* قيمة اليوم = الراتب المعتمد ÷ عدد أيام الشهر */
function dayWage(e){const cfg=absDeductCfg(branchForEmp(e));const base=cfg.base==='basic'?(+e.basic||0):gross(e);return base/(cfg.days||30);}
/* خصم الغياب المحسوب تلقائيًا لشهر معين */
function absenceDeduct(e,ym){const cfg=absDeductCfg(branchForEmp(e));if(!cfg.on||!ym)return 0;const d=absDaysMonth(e,ym);if(d<=0)return 0;return Math.round(dayWage(e)*d*100)/100;}
function monthClaims(e,ym){if(!ym)return (e.claims||[]).reduce((s,d)=>s+(+d.amount||0),0);return (e.claims||[]).filter(d=>d.ym===ym).reduce((s,d)=>s+(+d.amount||0),0);}
/* الإضافي / الأوفر تايم (مبلغ موجب يُضاف لمستحق الشهر) */
function monthAdditions(e,ym){if(!ym)return (e.additions||[]).reduce((s,d)=>s+(+d.amount||0),0);return (e.additions||[]).filter(d=>d.ym===ym).reduce((s,d)=>s+(+d.amount||0),0);}
function netMonth(e,ym){return net(e)*monthFactor(e,ym)+monthAdditions(e,ym)-monthDeducts(e,ym)-monthClaims(e,ym)-absenceDeduct(e,ym);}
/* نهاية الخدمة: يُحتسب الراتب حتى تاريخ الإيقاف ثم يختفي من كشف الرواتب */
function termMonth(e){return e.endDate?e.endDate.slice(0,7):'';}
function activeInMonth(e,ym){if(ym&&e.hire&&ym<e.hire.slice(0,7))return false;if(!e.endDate)return e.status==='active';if(!ym)return true;return ym<=termMonth(e);}
function monthFactor(e,ym){if(!e.endDate)return 1;if(ym&&ym===termMonth(e)){const d=new Date(e.endDate);if(isNaN(d))return 1;const day=d.getDate();const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return Math.max(0,Math.min(1,day/dim));}return 1;}
function factorInfo(e,ym){if(!e.endDate||!ym||ym!==termMonth(e))return null;const d=new Date(e.endDate);const day=d.getDate();const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return{day,dim,date:e.endDate};}
function monthName(ym){if(!ym)return'كل الشهور';const d=new Date(ym+'-01');return isNaN(d)?ym:d.toLocaleDateString('ar-EG',{month:'long',year:'numeric'});}
function curMonth(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function remainPay(e){return net(e)-paidTotal(e);}
/* ===== رصيد الأجازات التلقائي حسب مدة الخدمة (استحقاق 21 يوم عن كل سنة افتراضياً) ===== */
/* تاريخ بداية احتساب الخدمة: تاريخ المباشرة إن وُجد وإلا تاريخ التعيين */
function serviceStartDate(e){return e.startDate||e.hire||'';}
/* معدل الاستحقاق السنوي لكل موظف (يوم/سنة) — افتراضي 21 */
function leaveRate(e){return (+e.annual>0)?(+e.annual):21;}
/* عدد أشهر الخدمة المكتملة حتى اليوم (أو حتى نهاية الخدمة للموقوفين) */
function serviceMonths(e){const s=serviceStartDate(e);if(!s)return 0;const sd=new Date(s);if(isNaN(sd))return 0;const ref=e.endDate?new Date(e.endDate):new Date();if(isNaN(ref))return 0;let m=(ref.getFullYear()-sd.getFullYear())*12+(ref.getMonth()-sd.getMonth());if(ref.getDate()<sd.getDate())m--;return Math.max(0,m);}
/* نص مدة الخدمة بشكل مقروء */
function serviceText(e){const m=serviceMonths(e);if(m<1)return 'أقل من شهر';const y=Math.floor(m/12),mm=m%12;const parts=[];if(y)parts.push(y+' سنة');if(mm)parts.push(mm+' شهر');return parts.join(' و');}
/* الرصيد المستحق المتراكم = أشهر الخدمة × (المعدل السنوي ÷ 12) */
function accruedLeave(e){const m=serviceMonths(e);return Math.round(m*(leaveRate(e)/12)*100)/100;}
/* إجمالي الاستحقاق المعتمد: المتراكم لو فيه تاريخ مباشرة/تعيين، وإلا الرصيد اليدوي */
function entitlement(e){return serviceStartDate(e)?accruedLeave(e):(+e.annual||0);}
function remain(e){return Math.round((entitlement(e)-usedDays(e))*100)/100;}
function diffDays(a,b){if(!a||!b)return 0;const d1=new Date(a),d2=new Date(b);if(isNaN(d1)||isNaN(d2))return 0;const n=Math.round((d2-d1)/86400000)+1;return n>0?n:0;}
function fmtD(s){if(!s)return '—';const d=new Date(s);if(isNaN(d))return s;return d.toLocaleDateString('ar-EG',{year:'numeric',month:'2-digit',day:'2-digit'});}

/* لوحة ملخص حضور اليوم للمكان الحالي (للمالك) */
function attTodayPanel(){

  const absent=Math.max(0,should-(presentNow+done));
  const lateC=rows.reduce((s,x)=>s+attCalc(b,x.e,x.r).late,0);
  const otC=rows.reduce((s,x)=>s+attCalc(b,x.e,x.r).ot,0);
  const site=b.site||siteDefault();
  return `<div class="panel"><h3 style="justify-content:space-between"><span>🕒 حضور اليوم — ${fmtD(date)}</span><button class="btn btn-light btn-sm" onclick="go('att')">فتح السجل الكامل ←</button></h3>

    ${rows.length?`<table><thead><tr><th>الموظف</th><th>حضور</th><th>انصراف</th><th>المدة</th><th>تأخير</th><th>إضافي</th></tr></thead><tbody>${rows.slice(0,8).map(({e,r})=>{const c=attCalc(b,e,r);return `<tr><td><b>${esc(e.name)}</b></td><td class="num">${fmtHM(r.in)}</td><td class="num">${r.out?fmtHM(r.out):'<span class="badge badge-green">مفتوح</span>'}</td><td class="num">${durText(c.worked)}</td><td class="num" style="color:${c.late?'var(--amber)':'var(--muted)'}">${c.late?c.late+' د':'—'}</td><td class="num" style="color:${c.ot?'var(--green)':'var(--muted)'}">${c.ot?c.ot+' د':'—'}</td></tr>`;}).join('')}</tbody></table>`:'<div class="empty"><span class="ico">🕒</span>لا توجد تسجيلات حضور اليوم</div>'}
  </div>`;
}

/* هل اسم المستخدم مستخدم؟ (بين الموظفين والمالك) */
function userExists(username,exceptId){
  const u=username.trim().toLowerCase();
  if(!u)return false;
  if(db.owner&&db.owner.username&&db.owner.username.toLowerCase()===u)return true;
  return db.branches.some(b=>(b.emps||[]).some(e=>e.id!==exceptId&&e.username&&e.username.toLowerCase()===u));
}

function renderPay(){

}

/* ===== تصدير كشف الرواتب إلى Excel (يتبع فلتر الشهر الحالي — يعمل بدون إنترنت) */
function exportPayXls(){
  const all=isAll();
  const ym=$('#payMonth')?.value||'';
  const lbl=monthName(ym);
  const list=(all?payEmpsForAgg():state.emps).filter(e=>activeInMonth(e,ym));
  if(!list.length){toast('لا يوجد موظفون للتصدير');return;}
  const n2=v=>Math.round((+v||0)*100)/100;
  const xS=v=>`<Cell><Data ss:Type="String">${esc(v==null?'':v)}</Data></Cell>`;
  const xSs=(st,v)=>`<Cell ss:StyleID="${st}"><Data ss:Type="String">${esc(v==null?'':v)}</Data></Cell>`;
  const xN=v=>`<Cell ss:StyleID="num"><Data ss:Type="Number">${n2(v)}</Data></Cell>`;
  const xNt=v=>`<Cell ss:StyleID="totn"><Data ss:Type="Number">${n2(v)}</Data></Cell>`;
  /* نسخ متبادلة للصفوف (zebra) */
  const xSz=(v,a)=>a?`<Cell ss:StyleID="strA"><Data ss:Type="String">${esc(v==null?'':v)}</Data></Cell>`:xS(v);
  const xNz=(v,a)=>a?`<Cell ss:StyleID="numA"><Data ss:Type="Number">${n2(v)}</Data></Cell>`:xN(v);
  const row=cells=>`<Row>${cells}</Row>`;
  const hdr=arr=>row(arr.map(h=>xSs('hdr',h)).join(''));
  const t={g:0,d:0,ins:0,n:0,ma:0,md:0,mc:0,due:0,p:0,r:0};
  const byB={};
  let rows1='';let rows3='';
  list.forEach((e,ix)=>{
    const az=ix%2===1;
    const factor=monthFactor(e,ym);const gr=gross(e)*factor,dd=deductions(e)*factor,ins=insAmount(e)*factor,nt=net(e)*factor;
    const md=monthDeducts(e,ym)+absenceDeduct(e,ym);const mc=monthClaims(e,ym);const ma=monthAdditions(e,ym);const due=nt+ma-md-mc;const pd=paidInMonth(e,ym);const rem=due-pd;
    const scopePays=(e.payments||[]).filter(p=>!ym||payYM(p)===ym);
    const stat=rem<=0&&pd>0?'مدفوع بالكامل':(pd>0?'دفع جزئي':'لم يُدفع');
    t.g+=gr;t.d+=dd;t.ins+=ins;t.n+=nt;t.ma+=ma;t.md+=md;t.mc+=mc;t.due+=due;t.p+=pd;t.r+=rem;
    const bkey=all?(e._branch||'—'):(state.name||'—');
    const bb=byB[bkey]||(byB[bkey]={cnt:0,g:0,n:0,due:0,p:0,r:0});
    bb.cnt++;bb.g+=gr;bb.n+=nt;bb.due+=due;bb.p+=pd;bb.r+=rem;
    const bcol=all?xSz(e._branch||'—',az):'';
    rows1+=row(bcol+xSz(e.name,az)+xSz(e.job||'',az)+xNz(gr,az)+xNz(dd,az)+xNz(ins,az)+xNz(nt,az)+xNz(ma,az)+xNz(md,az)+xNz(mc,az)+xNz(due,az)+xNz(pd,az)+xNz(scopePays.length,az)+xNz(rem,az)+xSz(stat,az));
    if(scopePays.length){
      scopePays.forEach(p=>{const atts=(p.attachments||[]);
        rows3+=row((all?xS(e._branch||'—'):'')+xS(e.name)+xS(monthName(payYM(p))||'—')+xS(fmtD(p.date))+xN(p.amount)+xS(p.note||'')+xN(atts.length)+xS(atts.map(a=>a.name||'ملف').join('، ')));});
    }else{
      rows3+=row((all?xS(e._branch||'—'):'')+xS(e.name)+xS(lbl)+xS('—')+xN(0)+xSs('muted','لا توجد دفعات')+xN(0)+xS('—'));
    }
  });
  const MC=all?14:13;
  const foot1=row((all?xSs('tot',''):'')+xSs('tot','الإجمالي')+xSs('tot','')+xNt(t.g)+xNt(t.d)+xNt(t.ins)+xNt(t.n)+xNt(t.ma)+xNt(t.md)+xNt(t.mc)+xNt(t.due)+xNt(t.p)+xSs('tot','')+xNt(t.r)+xSs('tot',''));
  const head1=hdr((all?['المكان / الشركة']:[]).concat(['الموظف','الوظيفة','الإجمالي','الخصومات الثابتة','التأمينات','الصافي','إضافي','خصم الشهر','مطالبة مالية','المستحق','المدفوع','عدد الدفعات','المتبقي','الحالة']));
  const title1=row(`<Cell ss:StyleID="title" ss:MergeAcross="${MC}"><Data ss:Type="String">💰 كشف الرواتب — شهر ${esc(lbl)}${all?' — كل الأماكن':' — '+esc(state.name)}</Data></Cell>`);
  // شيت حسب المكان (يظهر دايمًا — مفيد لنظام الشركات)
  const bkeys=Object.keys(byB);
  const headB=hdr(['المكان / الشركة','عدد الموظفين','إجمالي الرواتب','الصافي','المستحق','المدفوع','المتبقي']);
  const rowsB=bkeys.map((k,ix)=>{const b=byB[k];const az=ix%2===1;return row(xSz(k,az)+xNz(b.cnt,az)+xNz(b.g,az)+xNz(b.n,az)+xNz(b.due,az)+xNz(b.p,az)+xNz(b.r,az));}).join('');
  const footB=row(xSs('tot','الإجمالي العام')+xNt(list.length)+xNt(t.g)+xNt(t.n)+xNt(t.due)+xNt(t.p)+xNt(t.r));
  const titleB=row(`<Cell ss:StyleID="title" ss:MergeAcross="6"><Data ss:Type="String">🏢 كشف الرواتب حسب المكان/الشركة — ${esc(lbl)}</Data></Cell>`);
  // شيت تفاصيل الدفعات
  const head3=hdr((all?['المكان / الشركة']:[]).concat(['الموظف','شهر الراتب','تاريخ الدفع','المبلغ','طريقة الدفع / ملاحظة','عدد المرفقات','أسماء المرفقات']));
  const MC3=all?7:6;
  const foot3=row((all?xSs('tot',''):'')+xSs('tot','الإجمالي المدفوع')+xSs('tot','')+xSs('tot','')+xNt(t.p)+xSs('tot','')+xSs('tot','')+xSs('tot',''));
  const title3=row(`<Cell ss:StyleID="title" ss:MergeAcross="${MC3}"><Data ss:Type="String">💳 تفاصيل الدفعات لكل موظف — ${esc(lbl)}</Data></Cell>`);
  const rtl='<WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><DisplayRightToLeft/></WorksheetOptions>';
  const styles='<Styles>'
    +'<Style ss:ID="hdr"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#2563EB" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center" ss:Vertical="Center"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous"/><Border ss:Position="Top" ss:LineStyle="Continuous"/><Border ss:Position="Left" ss:LineStyle="Continuous"/><Border ss:Position="Right" ss:LineStyle="Continuous"/></Borders></Style>'
    +'<Style ss:ID="num"><NumberFormat ss:Format="#,##0.00"/></Style>'
    +'<Style ss:ID="strA"><Interior ss:Color="#EEF3FB" ss:Pattern="Solid"/></Style>'
    +'<Style ss:ID="numA"><Interior ss:Color="#EEF3FB" ss:Pattern="Solid"/><NumberFormat ss:Format="#,##0.00"/></Style>'
    +'<Style ss:ID="tot"><Font ss:Bold="1"/><Interior ss:Color="#DBEAFE" ss:Pattern="Solid"/></Style>'
    +'<Style ss:ID="totn"><Font ss:Bold="1"/><Interior ss:Color="#DBEAFE" ss:Pattern="Solid"/><NumberFormat ss:Format="#,##0.00"/></Style>'
    +'<Style ss:ID="muted"><Font ss:Color="#888888" ss:Italic="1"/></Style>'
    +'<Style ss:ID="title"><Font ss:Bold="1" ss:Size="14" ss:Color="#1E3A8A"/></Style>'
    +'</Styles>';
  const ws=(name,inner)=>`<Worksheet ss:Name="${esc(name)}"><Table>${inner}</Table>${rtl}</Worksheet>`;
  const xml='<?xml version="1.0" encoding="UTF-8"?>\n<?mso-application progid="Excel.Sheet"?>\n'
    +'<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:html="http://www.w3.org/TR/REC-html40">'
    +styles
    +ws('كشف الرواتب',title1+head1+rows1+foot1)
    +ws('حسب المكان',titleB+headB+rowsB+footB)
    +ws('تفاصيل الدفعات',title3+head3+rows3+foot3)
    +'</Workbook>';
  const blob=new Blob(['\ufeff'+xml],{type:'application/vnd.ms-excel;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='كشف_الرواتب_'+(ym||'الكل')+(all?'_كل_الأماكن':'_'+state.name)+'.xls';
  document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast('تم تصدير كشف '+lbl+' (3 أوراق) إلى Excel');
}

  </form>`:`<div class="badge badge-green" style="padding:8px 14px;display:inline-block;margin-bottom:14px">✅ تم سداد راتب ${lbl} بالكامل</div><div class="modal-actions"><button type="button" class="btn btn-light" onclick="closeModal()">إغلاق</button></div>`}
  <h4 style="margin:18px 0 8px">📅 سجل دفعات ${ym?lbl:'(كل الشهور)'}</h4>
  <table><thead><tr><th>تاريخ الدفع</th><th>المبلغ</th><th>ملاحظة</th><th>مستند السداد</th><th>إجراء</th></tr></thead><tbody>${rows}</tbody></table>`;
  $('#modalBg').classList.add('open');
}
function savePayment(ev,id,ym){
  ev.preventDefault();const e=state.emps.find(x=>x.id===id);const f=ev.target;ym=ym||'';
  let amt=parseFloat(f.amount.value);const date=f.date.value;const note=f.note.value.trim();
  if(isNaN(amt)||amt<=0){toast('أدخل مبلغًا صحيحًا');return false;}
  const rem=netMonth(e,ym)-paidInMonth(e,ym);
  if(amt>rem+0.001){toast('المبلغ أكبر من المتبقي ('+money(rem)+' ر.س)');return false;}
  const files=(f.files&&f.files.files)?Array.from(f.files.files):[];
  readAttachments(files,atts=>{
    e.payments.push({id:e.pseq++,date,amount:amt,note,ym,attachments:atts});
    save();renderPay();payModal(id,ym);toast('تم تسجيل دفعة '+money(amt)+' ر.س'+(atts.length?' + '+atts.length+' مرفق':''));
  });
  return false;
}
/* قراءة مرفقات مستند السداد وتحويلها إلى Base64 (تدعم أكثر من ملف للدفعة الواحدة) */
function readAttachments(files,cb){
  if(!files||!files.length){cb([]);return;}
  const out=[];let done=0;
  files.forEach((file,i)=>{
    const r=new FileReader();
    r.onload=()=>{out[i]={name:file.name,type:file.type||'',size:file.size||0,data:r.result};if(++done===files.length)cb(out.filter(Boolean));};
    r.onerror=()=>{if(++done===files.length)cb(out.filter(Boolean));};
    r.readAsDataURL(file);
  });
}
/* إضافة مرفقات لدفعة قائمة (في حالة السداد على مراحل) */
function addAtt(id,pid,ym){
  const inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.accept='image/*,application/pdf,.pdf,.png,.jpg,.jpeg';
  inp.onchange=()=>{const files=Array.from(inp.files||[]);if(!files.length)return;
    readAttachments(files,atts=>{if(!atts.length)return;const e=state.emps.find(x=>x.id===id);const p=(e.payments||[]).find(x=>x.id===pid);if(!p)return;p.attachments=(p.attachments||[]).concat(atts);save();payModal(id,ym||'');toast('تم إضافة '+atts.length+' مرفق');});
  };
  inp.click();
}
/* حذف مرفق مفرد من دفعة */
function delAtt(id,pid,idx,ym){
  const e=state.emps.find(x=>x.id===id);const p=(e.payments||[]).find(x=>x.id===pid);if(!p||!p.attachments)return;
  if(!confirm('حذف هذا المرفق ؟'))return;
  p.attachments.splice(idx,1);save();payModal(id,ym||'');toast('تم حذف المرفق');
}
function attCell(id,pid,atts,ym){
  const links=(atts||[]).map((a,i)=>`<div style="display:flex;align-items:center;gap:4px;margin:2px 0"><a href="${a.data}" target="_blank" download="${esc(a.name)}" title="${esc(a.name)}" style="font-size:12px">📎 ${esc(a.name&&a.name.length>18?a.name.slice(0,15)+'…':(a.name||'ملف'))}</a><button class="btn btn-danger btn-sm" style="padding:0 6px;font-size:12px" onclick="delAtt(${id},${pid},${i},'${ym}')">×</button></div>`).join('');
  return (links||'<span class="hint">—</span>')+`<button class="btn btn-light btn-sm" style="margin-top:4px;font-size:11px" onclick="addAtt(${id},${pid},'${ym}')">➕ مرفق</button>`;
}
function delPayment(id,pid,ym){
  const e=state.emps.find(x=>x.id===id);if(!confirm('حذف هذه الدفعة ؟'))return;
  e.payments=e.payments.filter(p=>p.id!==pid);save();renderPay();payModal(id,ym||'');toast('تم حذف الدفعة');
}

function updLvBal(){const f=$('#lvF');if(!f)return;const e=state.emps.find(x=>x.id===+f.emp.value);if(!e)return;const r=remain(e);
  $('#lvBal').innerHTML=`الرصيد المتبقي: <b style="color:${r<=0?'var(--red)':'var(--green)'}">${r} يوم</b> من أصل ${entitlement(e)} (مدة الخدمة: ${serviceText(e)})`;}
function lvTypeChg(){const f=$('#lvF');if(!f)return;$('#lvOtherWrap').style.display=f.type.value==='أخرى'?'':'none';}
function calcLv(){const f=$('#lvF');if(!f)return;const s=f.start.value,en=f.end.value;const n=diffDays(s,en);f.days.value=n||'';
  if(en&&!f.back.value){const d=new Date(en);d.setDate(d.getDate()+1);f.back.value=d.toISOString().slice(0,10);}
}
function saveLeave(ev){
  ev.preventDefault();const f=ev.target;const e=state.emps.find(x=>x.id===+f.emp.value);
  if(!e){toast('اختر الموظف');return false;}
  let type=f.type.value;if(type==='أخرى'){type=f.other.value.trim()||'أخرى';}
  const extra=f.note.value.trim();
  const label=extra?`${type} - ${extra}`:type;
  const start=f.start.value,end=f.end.value,back=f.back.value;
  const days=diffDays(start,end);
  if(days<=0){toast('تأكد من أن تاريخ النهاية بعد البداية');return false;}
  if(days>remain(e)){toast('الرصيد المتبقي لا يكفي ('+remain(e)+' يوم)');return false;}
  e.leaves.push({id:state.lseq++,start,end,back,days,type,note:label});
  save();closeModal();render();toast('تم تسجيل أجازة '+days+' يوم لـ '+e.name);return false;
}
function delLeave(eid,lid){const e=state.emps.find(x=>x.id===eid);if(!confirm('حذف سجل الأجازة ؟'))return;e.leaves=e.leaves.filter(l=>l.id!==lid);save();render();toast('تم حذف الأجازة');}

/* ═════════════════ الحضور والانصراف ═════════════════ */
/* إعدادات وقت الموظف (مع استخدام إعدادات المكان كافتراضي) */
function empWork(e,branch){const w=(e&&e.work)?e.work:(branch?branch.work:workDefault());const d=workDefault();return {start:w.start||d.start,end:w.end||d.end,graceLate:w.graceLate!=null?w.graceLate:d.graceLate,otAfter:w.otAfter!=null?w.otAfter:d.otAfter,days:(w.days&&w.days.length)?w.days:d.days};}
function todayStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function nowHM(){const d=new Date();const p=n=>String(n).padStart(2,'0');return p(d.getHours())+':'+p(d.getMinutes());}
function hmToMin(hm){if(!hm)return null;const [h,m]=hm.split(':').map(Number);if(isNaN(h))return null;return h*60+(m||0);}
function minToHM(m){m=Math.max(0,Math.round(m||0));const h=Math.floor(m/60),mm=m%60;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');}
function fmtHM(hm){if(!hm)return '—';return hm;}
/* مسافة بين نقطتين بالمتر */
function distMeters(la1,lo1,la2,lo2){const R=6371000;const t=x=>x*Math.PI/180;const dLa=t(la2-la1),dLo=t(lo2-lo1);const a=Math.sin(dLa/2)**2+Math.cos(t(la1))*Math.cos(t(la2))*Math.sin(dLo/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
/* سجلات اليوم لموظف */
function attRowsEmp(branch,eid,date){return (branch.att&&branch.att.rows||[]).filter(r=>r.eid===eid&&r.date===date).sort((a,b)=>(a.in||'').localeCompare(b.in||''));}
function attTodayOpen(branch,eid){const date=todayStr();const rs=attRowsEmp(branch,eid,date);for(let i=rs.length-1;i>=0;i--){if(!rs[i].out)return rs[i];}return null;}
function attHasInToday(branch,eid){return attRowsEmp(branch,eid,todayStr()).length>0;}

/* هل اليوم يوم عمل للموظف؟ */
function isWorkDay(e,dateStr){const w=empWork(e,state);const d=new Date(dateStr+'T00:00:00');if(isNaN(d))return true;return (w.days||[]).includes(d.getDay());}
/* حساب التأخير والإضافي والانصراف المبكر لسجل */
function attCalc(branch,e,row){
  const w=empWork(e,branch);
  const s=hmToMin(w.start),en=hmToMin(w.end),inm=hmToMin(row.in),outm=hmToMin(row.out);
  let late=0,early=0,ot=0,worked=0;
  if(inm!=null&&s!=null)late=Math.max(0,inm-s-(+w.graceLate||0));
  if(inm!=null&&outm!=null&&outm>=inm)worked=outm-inm;else if(inm!=null&&outm!=null)worked=(1440-inm)+outm;
  if(outm!=null&&en!=null){if(outm<en)early=Math.max(0,en-outm);else ot=Math.max(0,outm-en-(+w.otAfter||0));}
  return {late,early,ot,worked,start:w.start,end:w.end,graceLate:w.graceLate};
}
function attBadge(status){return status==='in'?'<span class="badge badge-green">حاضر (لم يسجل انصراف)</span>':'<span class="badge badge-blue">مكتمل</span>';}
function durText(mins){if(!mins&&mins!==0)return '—';const h=Math.floor(mins/60),m=mins%60;return (h?h+' س ':'')+m+' د';}

/* ═══ الغياب التلقائي ═══ */
function dateAddDays(ds,n){const d=new Date(ds+'T00:00:00');if(isNaN(d))return ds;d.setDate(d.getDate()+n);const p=x=>String(x).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
/* نسخة من isWorkDay بتاخد الفرع صراحة (مش من state العام) عشان تشتغل صح لكل الفروع */
function isWorkDayB(e,branch,dateStr){const w=empWork(e,branch);const d=new Date(dateStr+'T00:00:00');if(isNaN(d))return true;return (w.days||[]).includes(d.getDay());}
/* هل الموظف نشط في التاريخ ده؟ (بعد المباشرة وقبل نهاية الخدمة) */
function empActiveOn(e,dateStr){const start=serviceStartDate(e);if(start&&dateStr<start)return false;if(e.endDate){return dateStr<=e.endDate;}return e.status==='active';}
/* هل الموظف في أجازة في التاريخ ده؟ */
function empOnLeave(e,dateStr){return (e.leaves||[]).some(l=>l.start&&l.end&&dateStr>=l.start&&dateStr<=l.end);}
/* يمشّي من آخر يوم اتفحص (absFrom) لحد امبارح، ويسجّل غياب تلقائي لأي يوم عمل
   الموظف ماعملش فيه أي حركة (مش في أجازة ومش غير نشط ومافيش تسجيل). سقف 92 يوم للأمان */
function autoMarkAbsences(b){
  if(!b||!b.att)return 0;
  if(!Array.isArray(b.att.rows))b.att.rows=[];
  if(b.att.seq==null)b.att.seq=1;
  const yest=dateAddDays(todayStr(),-1);
  if(b.att.absFrom==null){b.att.absFrom=yest;return 0;}  /* أول مرة: نحط خط البداية من امبارح بدون غياب رجعي */
  if(b.att.absFrom>=yest)return 0;
  let cur=dateAddDays(b.att.absFrom,1),added=0,guard=0;
  while(cur<=yest&&guard<92){
    guard++;
    (b.emps||[]).forEach(e=>{
      if(!empActiveOn(e,cur))return;
      if(!isWorkDayB(e,b,cur))return;
      if(empOnLeave(e,cur))return;
      if(attRowsEmp(b,e.id,cur).length>0)return;
      b.att.rows.push({id:b.att.seq++,eid:e.id,date:cur,in:null,out:null,absent:true,auto:true});
      added++;
    });
    cur=dateAddDays(cur,1);
  }
  b.att.absFrom=yest;
  return added;
}

/* تحديث الساعة الحية + الموقع في تبويب الموظف */
let _liveTimer=null,_myPos=null,_geoWatch=null;
function startLiveClock(){
  clearInterval(_liveTimer);
  const tick=()=>{const c=$('#liveClock');if(!c){clearInterval(_liveTimer);return;}const d=new Date();const p=n=>String(n).padStart(2,'0');c.innerHTML=p(d.getHours())+':'+p(d.getMinutes())+'<span class="sec">:'+p(d.getSeconds())+'</span>';const dd=$('#liveDate');if(dd)dd.textContent=d.toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});};
  tick();_liveTimer=setInterval(tick,1000);
}
/* يرسم شريط الحالة حسب آخر موقع متوفّر */
function renderGpsChip(){
  const c=$('#myGpsChip');if(!c)return;
  if(!_myPos){c.className='gps-chip wait';c.textContent='📍 جارٍ قراءة موقعك تلقائيًا…';return;}
  const b=currentBranchOf();const s=b?b.site:null;
  if(s&&s.lat!=null){
    const d=Math.round(distMeters(_myPos.lat,_myPos.lng,s.lat,s.lng));
    const ok=d<=s.radius;
    c.className='gps-chip '+(ok?'ok':'bad');
    c.textContent=(ok?'✅ داخل نطاق العمل':'❌ خارج نطاق العمل')+` — المسافة ${d} م (النطاق ${s.radius} م)`+(_myPos.acc?` • دقة ±${_myPos.acc} م`:'')+(_myPos.manual?' • يدوي':' • تلقائي 🔄');
  } else {
    c.className='gps-chip ok';c.textContent='✅ تم قراءة موقعك — لم يُحدد موقع العمل بعد';
  }
}
/* يقفل/يفتح أزرار الحضور حسب صلاحية الموقع، ويحدّثها لحظيًا */
function syncAttButtons(){
  const b=currentBranchOf();if(!b)return;
  const s=b.site||siteDefault();
  const ok=(s.lat!=null&&s.lng!=null)&&_myPos&&!_myPos.manual&&(!_myPos.acc||_myPos.acc<=100)&&(Math.round(distMeters(_myPos.lat,_myPos.lng,s.lat,s.lng))<=s.radius);
  const bi=$('#btnCheckIn'),bo=$('#btnCheckOut'),msg=$('#attLockMsg');
  if(bi){const open=bi.getAttribute('data-open')==='1';bi.disabled=!(ok&&!open);bi.style.opacity=(ok&&!open)?'':'0.45';}
  if(bo){const open=bo.getAttribute('data-open')==='1';bo.disabled=!(ok&&open);bo.style.opacity=(ok&&open)?'':'0.45';}
  if(msg)msg.style.display=ok?'none':'';
}
/* تتبّع الموقع تلقائيًا بشكل مستمر بدون الضغط على أي زر */
function startGpsWatch(){
  stopGpsWatch();
  const c=$('#myGpsChip');if(c&&!_myPos){c.className='gps-chip wait';c.textContent='📍 جارٍ قراءة موقعك تلقائيًا…';}
  if(!navigator.geolocation){if(c){c.className='gps-chip bad';c.textContent='⚠ المتصفح لا يدعم تحديد الموقع';}return;}
  try{
    _geoWatch=navigator.geolocation.watchPosition(
      p=>{_myPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)};renderGpsChip();syncAttButtons();},
      err=>{const cc=$('#myGpsChip');if(cc&&!_myPos){cc.className='gps-chip bad';cc.textContent='⚠ تعذّر قراءة الموقع تلقائيًا — اسمح بالوصول للموقع من إعدادات المتصفح';}},
      {enableHighAccuracy:true,timeout:20000,maximumAge:5000}
    );
  }catch(e){}
}
function stopGpsWatch(){if(_geoWatch!=null&&navigator.geolocation){try{navigator.geolocation.clearWatch(_geoWatch);}catch(e){}}_geoWatch=null;}
/* زر «تحديث يدوي» (اختياري): يأخذ قراءة فورية دقيقة */
function refreshMyGps(){
  const c=$('#myGpsChip');if(c){c.className='gps-chip wait';c.textContent='⏳ جارٍ قراءة الموقع…';}
  getPos().then(p=>{_myPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)};renderGpsChip();syncAttButtons();})
  .catch(err=>{if(c&&!_myPos){c.className='gps-chip bad';c.textContent='⚠ تعذّر قراءة الموقع — اسمح بالوصول للموقع من إعدادات المتصفح';}});
}
function useManualLoc(){const la=parseFloat($('#manLat')?.value),ln=parseFloat($('#manLng')?.value);if(isNaN(la)||isNaN(ln)){toast('أدخل إحداثيات صحيحة');return;}_myPos={lat:la,lng:ln,acc:0,manual:true};const c=$('#myGpsChip');if(c){c.className='gps-chip wait';c.textContent='📌 تم استخدام إحداثيات يدوية: '+la.toFixed(5)+' , '+ln.toFixed(5);}toast('تم استخدام الإحداثيات اليدوية');}

/* ═══ منطق تسجيل الحضور/الانصراف مع التحقق ═══ */
function verifyLocation(branch,e){
  const site=branch.site||siteDefault();
  /* موقع العمل لازم يكون محدد أولاً */
  if(site.lat==null||site.lng==null)return {ok:false,msg:'⚠️ لم يتم تحديد موقع العمل لهذا المكان بعد — راجع المدير.'};
  /* لازم قراءة موقع حقيقية من الجهاز (GPS) — نرفض الإحداثيات اليدوية تمامًا */
  if(!_myPos)return {ok:false,msg:'📍 لم نتمكن من قراءة موقعك. لازم تسمح للمتصفح بالوصول للموقع وتكون القراءة ناجحة قبل تسجيل أي حركة.'};
  if(_myPos.manual)return {ok:false,msg:'🚫 الإحداثيات اليدوية غير مسموح بها — لازم موقع حقيقي من الجهاز.'};
  /* رفض القراءات غير الدقيقة (أقل من 100 متر دقة) — لا نقبل موقعاً مشكوكًا فيه */
  if(_myPos.acc&&_myPos.acc>100)return {ok:false,msg:'📡 إشارة الموقع ضعيفة (دقة ±'+_myPos.acc+' م). اقترب من مكان مكشوف واستنى لحظة لحد ما الإشارة تتحسن.'};
  const d=distMeters(_myPos.lat,_myPos.lng,site.lat,site.lng);
  if(d>site.radius)return {ok:false,msg:'❌ أنت خارج موقع العمل — المسافة '+Math.round(d)+' م والنطاق المسموح '+site.radius+' م. اقترب من الموقع وحاول تاني.'};
  return {ok:true,dist:Math.round(d)};
}
function checkIn(){
  const e=currentEmp(),b=currentBranchOf();if(!e||!b)return;
  if(attTodayOpen(b,e.id)){toast('عندك حضور مفتوح بالفعل — سجّل انصراف الأول');return;}
  const v=verifyLocation(b,e);if(!v.ok){toast(v.msg);alert(v.msg);return;}
  b.att.rows.push({id:b.att.seq++,eid:e.id,date:todayStr(),in:nowHM(),out:null,lat:+_myPos.lat.toFixed(6),lng:+_myPos.lng.toFixed(6),dist:v.dist,manual:!!_myPos.manual});
  save();toast('🟢 تم تسجيل الحضور '+nowHM());render();
}
function checkOut(){
  const e=currentEmp(),b=currentBranchOf();if(!e||!b)return;
  const row=attTodayOpen(b,e.id);if(!row){toast('مفيش حضور مفتوح — سجّل حضور الأول');return;}
  const v=verifyLocation(b,e);if(!v.ok){toast(v.msg);alert(v.msg);return;}
  row.out=nowHM();row.outDist=v.dist;
  save();const c=attCalc(b,e,row);toast('🔴 تم تسجيل الانصراف '+row.out+(c.ot?` • إضافي ${c.ot} د`:''));render();
}

/* ═══ تبويب المالك: سجل الحضور ═══ */
function attOf(emps,branch,date,from,to){
  const rows=[];
  (branch.att&&branch.att.rows||[]).forEach(r=>{
    if(date&&r.date!==date)return;if(from&&r.date<from)return;if(to&&r.date>to)return;
    const e=(branch.emps||[]).find(x=>x.id===r.eid);if(!e)return;if(emps&&!emps.includes(e.id))return;
    rows.push({e,b:branch,r});
  });
  return rows.sort((a,b)=>(b.r.date+b.r.in).localeCompare(a.r.date+a.r.in));
}
function vAtt(){

  return `<div class="page-title">🕒 سجل الحضور والانصراف</div>
  <div class="page-sub">سجل مستقل لكل موظف في <b>${esc(state.name)}</b> — ملخص شهري لحساب الرواتب (أيام الحضور/الغياب، التأخير، الإضافي)</div>
  <div class="toolbar">
    <label style="font-size:13px;color:var(--muted);font-weight:600">الشهر:</label><input type="month" id="attMonth" onchange="attPickMonth()">

    <button class="btn btn-light btn-sm" onclick="attQuickRange(0)">اليوم</button>
    <button class="btn btn-light btn-sm" onclick="attQuickRange(6)">آخر أسبوع</button>
    <button class="btn btn-light btn-sm" onclick="attQuickRange(29)">آخر شهر</button>

  </div>

}
function attQuickRange(back){
  const to=new Date();const from=new Date();from.setDate(from.getDate()-back);const p=n=>String(n).padStart(2,'0');const f=x=>x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate());
  $('#attFrom').value=f(from);$('#attTo').value=f(to);renderAttTable();
}
function attFiltered(){
  const from=$('#attFrom')?.value||'',to=$('#attTo')?.value||'',emp=$('#attEmp')?.value||'';
  const ids=emp?[+emp]:null;
  return attOf(ids,state,'',from,to);
}
/* يضبط النطاق على شهر كامل عند اختيار شهر من منتقي الشهر */
function attPickMonth(){
  const m=$('#attMonth')?.value||'';if(!m){renderAttTable();return;}
  const [y,mo]=m.split('-').map(Number);const p=n=>String(n).padStart(2,'0');
  const last=new Date(y,mo,0).getDate();
  if($('#attFrom'))$('#attFrom').value=`${m}-01`;
  if($('#attTo'))$('#attTo').value=`${m}-${p(last)}`;
  renderAttTable();
}
/* تسجيلات موظف ضمن نطاق تاريخي */
function attEmpRowsInRange(e,from,to){return (state.att&&state.att.rows||[]).filter(r=>r.eid===e.id&&(!from||r.date>=from)&&(!to||r.date<=to));}
/* ملخص فترة لموظف واحد (لحساب الراتب آخر الشهر) */
function attEmpSummary(e,from,to){
  const rows=attEmpRowsInRange(e,from,to);
  const present=rows.filter(r=>!r.absent&&r.in);
  const absentRows=rows.filter(r=>r.absent);
  const unexcused=absentRows.filter(r=>!r.excuse);
  const excusedRows=absentRows.filter(r=>r.excuse);
  const presentDays=new Set(present.map(r=>r.date)).size;
  const absentDays=new Set(unexcused.map(r=>r.date)).size;
  const excusedDays=new Set(excusedRows.map(r=>r.date)).size;
  let worked=0,late=0,early=0,ot=0,open=0;
  present.forEach(r=>{const c=attCalc(state,e,r);worked+=c.worked;late+=c.late;early+=c.early;ot+=c.ot;if(!r.out)open++;});
  return {rows,present,presentDays,absentDays,excusedDays,worked,late,early,ot,open};
}
/* ينتقل لقسم تفاصيل موظف محدد */
function attToggleEmp(id){const b=$('#attBody_'+id),c=$('#attChev_'+id);if(!b)return;const open=b.style.display!=='none';b.style.display=open?'none':'';if(c)c.textContent=open?'▸':'▾';}
function attFocusEmp(id){const b=$('#attBody_'+id),c=$('#attChev_'+id);if(b){b.style.display='';if(c)c.textContent='▾';}const el=$('#attEmp_'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
/* ✅ تسجيل حضور قياسي بضغطة واحدة: يسجّل الموظف حاضر بساعات العمل المحددة له (الدخول والخروج الرسميين)
   — مفيد للعمالة الدائمة اللي بتحضر على طول ومش محتاجة تتعامل مع النظام.
   التاريخ: لو مختار يوم واحد محدد (من=إلى) بيسجّل عليه، غير كده بيسجّل على تاريخ النهاردة. */
function attQuickPresent(id){
  const e=state.emps.find(x=>x.id===id);if(!e)return;
  const w=empWork(e,state);
  /* الفترة: ناخد المختارة في (من/إلى)، ولو فاضية ناخد الشهر الحالي */
  let from=$('#attFrom')?.value||'',to=$('#attTo')?.value||'';
  const nd=new Date();const pp=n=>String(n).padStart(2,'0');
  const ym=nd.getFullYear()+'-'+pp(nd.getMonth()+1);
  const lastD=new Date(nd.getFullYear(),nd.getMonth()+1,0).getDate();
  if(!from)from=ym+'-01';
  if(!to)to=ym+'-'+pp(lastD);
  const today=todayStr();
  if(to>today)to=today;           /* منسجّلش حضور لأيام لسه ماجتش (المستقبل) */
  if(from>to){toast('⚠️ مفيش أيام عمل في الفترة دي');return;}
  const workDays=(w.days&&w.days.length)?w.days:[0,1,2,3,4];
  if(!confirm('✅ تسجيل حضور قياسي لـ «'+e.name+'» لكل أيام العمل غير المتحضّرة من '+fmtD(from)+' إلى '+fmtD(to)+'\nبساعات عمله ('+w.start+' – '+w.end+').\nالأيام المتحضّرة بالفعل والغياب بعذر مش هتتغير.\nتمام؟'))return;
  const rows=(state.att.rows||(state.att.rows=[]));
  const byDate={};rows.forEach(r=>{if(r.eid===id)byDate[r.date]=r;});
  const [fy,fm,fd]=from.split('-').map(Number);
  const [ty,tm,td]=to.split('-').map(Number);
  let cur=new Date(fy,fm-1,fd);const end=new Date(ty,tm-1,td);
  let added=0,updated=0,skipped=0,excused=0;
  while(cur<=end){
    const ds=cur.getFullYear()+'-'+pp(cur.getMonth()+1)+'-'+pp(cur.getDate());
    if(workDays.includes(cur.getDay())){
      const r=byDate[ds];
      if(r){
        if(r.excuse){excused++;}                 /* غياب بعذر/أجازة — مانلمسهوش */
        else if(!r.absent&&r.in){skipped++;}       /* متحضّر بالفعل */
        else{r.in=w.start;r.out=w.end;r.absent=false;delete r.auto;r.excuse=false;r.excuseNote='';r.edited=true;r.fixed=true;updated++;}
      }else{
        rows.push({id:state.att.seq++,eid:id,date:ds,in:w.start,out:w.end,absent:false,fixed:true,edited:true});added++;
      }
    }
    cur.setDate(cur.getDate()+1);
  }
  const changed=added+updated;
  save();renderAttTable();
  if(!changed){toast('ℹ️ كل أيام العمل متحضّرة بالفعل لـ '+e.name);return;}
  toast('✅ حضور قياسي لـ '+e.name+': '+changed+' يوم ('+w.start+'–'+w.end+')'+(excused?' • '+excused+' بعذر اتسابوا':''));
}

/* حل هوية المستخدم: بالإيميل → مالك أو موظف ممنوح (بيشتغل مع السحابة والأوفلاين) */
function resolveIdentity(loginId){
  const u=String(loginId||'').trim().toLowerCase();
  if(!u)return null;
  if(db.owner&&db.owner.username&&db.owner.username.toLowerCase()===u)return {role:'owner'};
  for(const b of db.branches){for(const e of (b.emps||[])){if(e.username&&e.username.toLowerCase()===u)return {role:'emp',bid:b.id,eid:e.id};}}
  return null;
}
let _loggingIn=false;
/* ═══ ميزة «تذكّرني» — تحفظ اسم المستخدم (بدون كلمة السر) عشان يتملّى أوتوماتيك ═══ */
const REMEMBER_KEY='payroll_remember_login';
function rememberGet(){try{const o=JSON.parse(localStorage.getItem(REMEMBER_KEY)||'null');return (o&&typeof o.u==='string'&&o.u)?o.u:'';}catch(e){return '';}}
function rememberSet(u){try{localStorage.setItem(REMEMBER_KEY,JSON.stringify({u:String(u||''),t:Date.now()}));}catch(e){}}
function rememberClear(){try{localStorage.removeItem(REMEMBER_KEY);}catch(e){}}
function applyRemember(u){
  const cb=$('#loginRemember');
  if(cb&&cb.checked)rememberSet(u);else rememberClear();
}
function prefillRemember(){
  const cb=$('#loginRemember'),u=$('#loginUser');
  const saved=rememberGet();
  if(saved&&u){u.value=saved;if(cb)cb.checked=true;}
  else if(cb){cb.checked=false;}
}
function toggleShowPass(){

async function doLogin(ev){
  ev.preventDefault();
  const u=$('#loginUser').value.trim(),p=$('#loginPass').value;const err=$('#loginErr');
  const btn=$('#loginBtn');if(_loggingIn)return false;_loggingIn=true;
  const done=()=>{_loggingIn=false;if(btn){btn.disabled=false;btn.textContent='🔓 دخول';}};
  if(btn){btn.disabled=true;btn.textContent='⏳ جاري الدخول...';}
  try{
    /* ⬅️ لو فيه تعديل محلي لسه ما اترفعش للسحابة، نرفعه الأول قبل أي سحب عشان السحب ميمسحوش */
    try{await cloudFlush();}catch(e){}
    const isEmail=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u);
    /* ── 1) إيميل + سحابة مفعّلة => الدخول عبر Supabase Auth ── */
    if(cloudOn&&sb&&sb.auth&&isEmail){
      const id=resolveIdentity(u);
      if(!id){err.textContent='❌ الإيميل ده مش مضاف في النظام (ضيفه كحساب موظف أو مالك أولاً)';err.classList.add('show');done();return false;}
      const r=await sb.auth.signInWithPassword({email:u,password:p});
      if(r.error){
        /* لو الإيميل لسه ما اتأكدش أو مش موجود سحابيًا: نجرّب الدخول المحلي كبديل */
        const fallback=findLoginUser(u,p);
        if(fallback&&/invalid_credentials|email_not_confirmed/i.test(r.error.message)){
          err.classList.remove('show');applyRemember(u);db.session=fallback;saveStores();enterApp();done();return false;
        }
        err.textContent='❌ '+arabAuthErr(r.error.message);err.classList.add('show');done();return false;
      }
      err.classList.remove('show');
      applyRemember(u);
      db.session=id;saveStores();
      await cloudPull();
      enterApp();
      cloudSubscribe();
      done();return false;
    }
    /* ── 2) اسم مستخدم (مش إيميل) => دخول محلي (الموظف باسمه العربي) ── */
    /* مهم: لو الجهاز جديد/مفيش بيانات محلية، نسحب أحدث نسخة من السحابة الأول
       عشان الموظف يقدر يدخل من أي جهاز (مش بس الجهاز اللي اتضاف منه). */
    let res=findLoginUser(u,p);
    if(cloudOn&&sb){
      try{
        await cloudPullSilent();      /* ⬅️ نسحب دايماً أحدث نسخة من السحابة عند الدخول (مش بس لو مفيش بيانات محلية) عشان الموظف يشوف تعديلات المدير */
        res=findLoginUser(u,p);
      }catch(e){}
    }
    if(!res){
      err.innerHTML='❌ اسم المستخدم أو كلمة السر غير صحيحة'+(cloudOn?'<br><span style="font-size:12px;opacity:.85">للموظف: اكتب اسمه كما هو مسجّل في النظام. للمالك: اكتب إيميله.</span>':'');
      err.classList.add('show');done();return false;
    }
    err.classList.remove('show');
    applyRemember(u);
    db.session=res;saveStores();
    enterApp();
    if(cloudOn&&sb)cloudSubscribe();   /* ⬅️ تفعيل التحديث اللحظي للموظف كمان (زي المالك) عشان تعديلات المدير توصله لحظياً */
    done();return false;
  }catch(e){
    err.textContent='❌ '+(arabAuthErr(e&&e.message)||'تعذّر الدخول');err.classList.add('show');done();return false;
  }
}
function arabAuthErr(m){
  m=String(m||'');
  /* مهم: نفحص "الإيميل ما اتأكدش" قبل "بيانات غلط" لأن بعض إعدادات Supabase ترجّع نفس الرد */
  if(/email_not_confirmed|Email not confirmed/i.test(m))return 'الإيميل لسه ما اتأكدش ⚠️ — من Supabase: Authentication ← Users ← اختار الحساب ← Confirm، أو اقفل خيار "Confirm email" من إعدادات الـEmail.';
  if(/invalid_credentials|Invalid login credentials/i.test(m))return 'الإيميل أو كلمة السر غير صحيحة (تأكد إن الحساب متأكد ومفعّل من Supabase)';
  if(/rate limit|too many/i.test(m))return 'محاولات كتير — استنى شوية وحاول تاني';
  if(/Failed to fetch|NetworkError/i.test(m))return 'مفيش اتصال بالإنترنت — جرّب تاني';
  return m;
}

/* ملاحظة: boot() لازم تشتغل بعد تحميل سكربت السحابة (عشان متغيراتها) — بتُنادى في آخر سكربت السحابة */
function findLoginUserById(s){if(!s||s.role!=='emp')return false;const b=db.branches.find(x=>x.id===s.bid);return !!(b&&(b.emps||[]).find(e=>e.id===s.eid));}

/* ═══════════ روابط تعيين كلمة السر (بدون خادم / بدون إنترنت) ═══════════
   الفكرة: المالك (أو مدير النظام) يولّد لكل موظف «رابط تعيين كلمة سر».
   الرابط ده عبارة عن نفس صفحة النظام + رمز موقّع بالبيانات.
   - يقدر يبعته للموظف (واتساب / إيميل / رسالة).
   - لما الموظف يفتح الرابط في المتصفح على جهازه، تظهر له شاشة صغيرة
     يكتب فيها كلمة السر اللي هو عايزها، فتُحفظ في متصفحه هو، ويقدر يدخل
     بيها على تبويب «الحضور والانصراف» من غير ما حد يشوف كلمته.
   - المالك يقدر يلغي كل الروابط المعلّقة في أي وقت.
*/
function sha1hex(str){return CryptoJS.SHA1(String(str)).toString();}
function isHashed(v){const p=String(v||'').split('$');return p.length===3&&p[0]==='h'&&/^[0-9a-f]{40}$/.test(p[2]);}
function makePwdHash(pwd){const salt=Math.random().toString(36).slice(2,12);return 'h$'+salt+'$'+sha1hex(salt+'|'+pwd+'|'+salt);}
function checkPwdAgainst(v,pwd){
  if(v==null||v==='')return false;
  if(!isHashed(v))return String(v)===String(pwd);
  const parts=String(v).split('$');           /* ['h', salt, hash] */
  return sha1hex(parts[1]+'|'+pwd+'|'+parts[1])===parts[2];
}
function ensureResetShape(){
  if(!db.owner)db.owner=ownerDefault();
  if(!db.owner.pwdHash)db.owner.pwdHash='';
  if(!Array.isArray(db.owner.resetTokens))db.owner.resetTokens=[];
  if(!db.owner.userPwdHash)db.owner.userPwdHash={};   /* id الموظف -> هاش كلمة السر المحلية */
  return db.owner;
}
/* البحث عن موظف بالمعرّف في كل الأماكن (لكل الأماكن معرّفات مستقلة) */
function branchOfEmp(eid){return (db.branches||[]).find(b=>(b.emps||[]).some(e=>e.id===eid));}
function empById(eid){const b=branchOfEmp(eid);return b?(b.emps||[]).find(e=>e.id===eid):null;}
/* كلمة سر المالك الفعّالة: الهاش الدائم إن وُجد، وإلا كلمة السر الافتراضية */
function ownerPwdAccept(p){
  ensureResetShape();
  if(db.owner.pwdHash)return checkPwdAgainst(db.owner.pwdHash,p);
  const d=ownerDefault();
  if(db.owner.username&&db.owner.username.toLowerCase()===String(d.username).toLowerCase())return String(p)===String(d.password);
  return String(p)==='admin';
}
/* كلمة سر الموظف: أولوية لهاش محلي محفوظ، ثم الكلمة المخزّنة (نص/هاش) */
function empPwdAccept(e,p){
  ensureResetShape();
  const h=db.owner.userPwdHash&&db.owner.userPwdHash[e.id];
  if(h)return checkPwdAgainst(h,p);
  return checkPwdAgainst(e.password,p);
}
function findLoginUser(username,password){
  const u=String(username||'').trim().toLowerCase(),p=String(password||'');
  if(!u)return null;
  if(db.owner&&db.owner.username&&db.owner.username.toLowerCase()===u){
    if(ownerPwdAccept(p))return {role:'owner'};
    return null;
  }
  for(const b of db.branches){for(const e of (b.emps||[])){if(e.username&&e.username.toLowerCase()===u&&empPwdAccept(e,p))return {role:'emp',bid:b.id,eid:e.id};}}
  return null;
}

/* ===== توليد / فك الرمز ===== */
/* Base64 آمن لعناوين الموقع ويعمل مع النصوص العربية (بدون unescape/escape) */
function b64enc(obj){
  const json=JSON.stringify(obj);
  const bytes=new TextEncoder().encode(json);
  let bin='';for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64dec(str){
  let s=String(str).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';
  const bin=atob(s);
  const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}
const RESET_TTL=1000*60*60*24*3; /* صلاحية الرابط 3 أيام */
function newResetToken(type,eid){
  ensureResetShape();
  const t={id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),type:type,eid:eid==null?null:eid,exp:Date.now()+RESET_TTL,maxUses:1,used:0,created:new Date().toISOString()};
  db.owner.resetTokens.push(t);
  if(db.owner.resetTokens.length>200)db.owner.resetTokens=db.owner.resetTokens.slice(-200);
  db.owner.resetCycle=(db.owner.resetCycle||0)+1;
  return t;
}
function makeResetLink(type,eid){
  ensureResetShape();
  const t=newResetToken(type,eid);
  const pay={v:1,type:type,eid:eid==null?null:eid,tid:t.id,exp:t.exp};
  const base=location.href.split('#')[0].split('?')[0];
  return base+'?rst='+b64enc(pay);
}
function parseResetFromURL(){
  const q=(location.search||'');
  const m=/[?&]rst=([^&]+)/.exec(q);
  if(!m)return null;
  let pay;try{pay=b64dec(decodeURIComponent(m[1]));}catch(e){return {bad:true};}
  if(!pay||pay.v!==1||!pay.tid||!pay.exp)return {bad:true};
  if(Date.now()>pay.exp)return {expired:true};
  ensureResetShape();
  const t=(db.owner.resetTokens||[]).find(x=>x.id===pay.tid);
  if(!t)return {bad:true};
  if(t.exp&&Date.now()>t.exp)return {expired:true};
  if(t.maxUses&&t.used>=t.maxUses)return {used:true};
  return {token:t,eid:pay.eid,type:pay.type};
}
function clearResetInURL(){
  try{history.replaceState(null,'',location.pathname);}catch(e){location.hash='';}
}

/* ===== نقطة البداية ===== */
async function boot(){
  ensureResetShape();
  /* ☁️ تهيئة السحابة + سحب أحدث نسخة الأول — لازم تتم قبل فحص رابط التعيين،
     عشان قائمة روابط التعيين (resetTokens) تكون اتحمّلت على جهاز الموظف.
     من غير كده الرابط بيطلع «غير صالح» بالغلط لأن القائمة لسه فاضية. */
  let cloudReady=false;
  try{
    const cfg=cloudCfg();
    if(cfg&&cfg.url&&cfg.key&&cfg.on!==false){
      if(cloudInit(cfg)){
        await cloudPull();
        cloudReady=true;
        /* لو فيه جلسة Auth سارية نكمل بيها — مع الحفاظ على جلسة الموظف المحلية */
        const usr=await cloudCurrentUser();
        if(!usr){if(!(db.session&&db.session.role==='emp'))db.session=null;}
      }
    }
  }catch(e){}
  ensureResetShape();
  /* فحص رابط التعيين بعد ما البيانات اتسحبت من السحابة */
  const r=parseResetFromURL();
  const hasSession=db.session&&(db.session.role==='owner'||findLoginUserById(db.session));
  /* رابط تعيين صالح (أو منتهي الصلاحية أو مستخدم) → افتح شاشة التعيين */
  if(r&&(r.token||r.expired||r.used)){openResetScreen(r);return;}
  /* رابط «غير صالح»: لو فيه جلسة شغّالة نتجاهله ونكمّل دخول عادي وننظّف الرابط من العنوان
     (عشان متظهرش رسالة «الرابط غير صالح» فوق رغم نجاح الدخول)، غير كده نعرض الرسالة فقط */
  if(r&&r.bad){
    if(!hasSession){openResetScreen({bad:true});return;}
    clearResetInURL();
  }
  /* وضع الدخول العادي → فعّل المزامنة اللحظية */
  if(cloudReady)cloudSubscribe();
  if(hasSession){
    if(!cloudOn||await cloudSessionOk()){enterApp();return;}
  }
  db.session=null;$('#loginScreen').classList.remove('hidden');
  setTimeout(()=>{
    try{prefillRemember();}catch(e){}
    try{
      const hasUser=($('#loginUser')&&$('#loginUser').value.trim());
      (hasUser?$('#loginPass'):$('#loginUser')).focus();
    }catch(e){}
  },200);
}
async function cloudSessionOk(){
  try{
    if(!cloudOn||!sb||!sb.auth)return true;
    /* الموظف بيدخل باسمه (مش Auth) — جلسته صحيحة طالما موجود في بيانات النظام */
    if(db.session&&db.session.role==='emp')return findLoginUserById(db.session);
    const u=await cloudCurrentUser();return !!u;
  }catch(e){return true;}
}
