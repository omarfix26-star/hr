  cloudChannel=null;
  const c=cloudCfg()||{};c.on=false;saveCloudCfg(c);
  renderCloudPanel&&renderCloudPanel();toast('تم فصل السحابة');
}
function cloudMsg(t,ok){
  const el=$('#clMsg');if(!el)return;
  el.textContent=t;
  el.className='cloud-msg '+(ok===true?'ok':ok===false?'bad':'wait');
}

/* ---- المزامنة اللحظية ---- */
function cloudSubscribe(){
  if(!sb)return;
  if(cloudChannel){try{sb.removeChannel(cloudChannel);}catch(e){}cloudChannel=null;}
  cloudChannel=sb.channel('payroll-sync')
    .on('postgres_changes',{event:'*',schema:'public',table:CLOUD_TABLE,filter:'id=eq.main'},(payload)=>{
      try{
        const row=payload.new;
        if(!row||!row.data)return;
        if(+row.updated_at<=lastCloudSync)return;   /* نسخة قديمة/صدى كتابتنا */
        if(cloudSaving)return;
        applyCloudState(row.data,+row.updated_at);
      }catch(e){}
    })
    .subscribe((st)=>{if(st==='SUBSCRIBED'){cloudState='online';renderCloudPanel&&renderCloudPanel();}});
}
async function cloudPullSilent(){
  /* سحب صامت لأحدث البيانات من غير ما نلمس واجهة المستخدم (للدخول من أي جهاز) */
  if(!sb||!cloudOn)return false;
  try{
    const r=await sb.from(CLOUD_TABLE).select('data,updated_at').eq('id','main').maybeSingle();
    if(r.error||!r.data)return false;
    applyCloudState(r.data,+r.data.updated_at||Date.now());
    return true;
  }catch(e){return false;}
}
async function cloudPull(){
  if(!sb)return false;
  cloudState='connecting';renderCloudPanel&&renderCloudPanel();
  const r=await sb.from(CLOUD_TABLE).select('data,updated_at').eq('id','main').maybeSingle();
  if(r.error){cloudState='error';cloudErr=r.error.message;renderCloudPanel&&renderCloudPanel();return false;}
  cloudState='online';
  if(!r.data){ /* أول مرة: نرفع الحالة المحلية */
    await cloudPush(true);return true;
  }
  applyCloudState(r.data,+r.data.updated_at||Date.now());
  return true;
}
function applyCloudState(dataObj,ts){
  const remote=(typeof dataObj==='string')?JSON.parse(dataObj):dataObj;
  if(!remote||!remote.branches)return;
  lastCloudSync=ts||Date.now();
  /* 🔒 نحافظ على جلسة الجهاز الحالي وتفضيلات العرض المحلية — ماننقلهاش من السحابة */
  const keepSession=db.session,keepActive=db.active,keepReport=db.reportBranch;
  db=remote;
  db.session=keepSession;
  if(keepActive&&(keepActive===ALL_VIEW||remote.branches.some(b=>b.id===keepActive)))db.active=keepActive;
  if(keepReport!=null)db.reportBranch=keepReport;
  ensureDBShape();
  syncState();
  try{localStorage.setItem(DB_KEY,JSON.stringify(db));}catch(e){}
  cloudTouchInfo();
  if(!$('#loginScreen')?.classList.contains('hidden'))return; /* مش داخل بعد */
  render();
}
let cloudPushTimer=null;let cloudLock=false;
async function cloudPush(force){
  if(!sb||!cloudOn)return false;
  const now=Date.now();
  if(cloudLock){cloudPending=true;return false;}
  cloudLock=true;cloudSaving=true;
  try{
    const stamp=Math.max(now,lastCloudSync+1);
    /* 🔒 الجلسة محلية لكل جهاز — نشيلها قبل الرفع عشان متتزامنش بين الأجهزة/المستخدمين */
    const data=Object.assign({},db);delete data.session;
    const r=await sb.from(CLOUD_TABLE).upsert({id:'main',data:data,updated_at:stamp},{onConflict:'id'});
    if(r.error){
      if(/does not exist|relation|schema/i.test(r.error.message)){cloudState='needtable';cloudErr=r.error.message;}
      else{cloudState='error';cloudErr=r.error.message;}
      renderCloudPanel&&renderCloudPanel();
      return false;
    }
    lastCloudSync=stamp;cloudState='online';cloudErr='';
    cloudTouchInfo();renderCloudPanel&&renderCloudPanel();
    return true;
  }catch(e){cloudState='error';cloudErr=(e&&e.message)||'فشل الرفع';renderCloudPanel&&renderCloudPanel();return false;}
  finally{
    cloudSaving=false;cloudLock=false;
    if(cloudPending){cloudPending=false;setTimeout(()=>cloudPush(),800);}
  }
}
function cloudSchedulePush(){
  if(!cloudOn||cloudState!=='online')return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer=setTimeout(()=>cloudPush(),700);
}
/* ⬅️ رفع فوري لأي تعديل معلّق (debounced) قبل الخروج/الدخول عشان البيانات متترجعش */
async function cloudFlush(){
  if(cloudPushTimer){clearTimeout(cloudPushTimer);cloudPushTimer=null;}
  if(cloudOn&&sb){try{await cloudPush(true);}catch(e){}}
}
/* ⬅️ دفاع إضافي: لو اتقفلت الصفحة/اتخبّت وفيه تعديل معلّق، ارفعه فوراً */
try{document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&cloudPushTimer){clearTimeout(cloudPushTimer);cloudPushTimer=null;try{cloudPush(true);}catch(e){}}});}catch(e){}
function cloudTouchInfo(){
  const s=$('#clSync');if(s)s.textContent=fmtDateTime(new Date().toISOString());
}

/* ---- حالة الدخول (Auth) ---- */
function cloudAuthReady(){return !!(cloudOn&&sb&&sb.auth);}
async function cloudSignIn(email,password){
  if(!cloudAuthReady())return {error:{message:'السحابة مش متظبطة'}};
  return await sb.auth.signInWithPassword({email:email,password:password});
}
async function cloudSignUp(email,password,name){
  if(!cloudAuthReady())return {error:{message:'السحابة مش متظبطة'}};
  return await sb.auth.signUp({email:email,password:password,options:{data:{name:name||''}}});
}
async function cloudSignOut(){if(cloudAuthReady()){try{await sb.auth.signOut();}catch(e){}}}
async function cloudCurrentUser(){if(!cloudAuthReady())return null;const r=await sb.auth.getUser();return (r&&r.data&&r.data.user)||null;}

/* ---- بيانات الجدول + سكربت SQL ---- */
function cloudSQL(){
  return `-- نفّذ السكربت ده في Supabase ← SQL Editor (مرة واحدة)
create table if not exists public.payroll_state (
  id text primary key,
  data jsonb not null,
  updated_at bigint not null default 0
);

alter table public.payroll_state enable row level security;

-- أي مستخدم مسجّل دخول (Auth) يقدر يقرأ ويكتب صف الحالة
create policy "payroll read"  on public.payroll_state for select to authenticated using (true);
create policy "payroll write" on public.payroll_state for insert to authenticated with check (true);
create policy "payroll upd"   on public.payroll_state for update to authenticated using (true) with check (true);

-- تفعيل المزامنة اللحظية
alter publication supabase_realtime add table public.payroll_state;`;
}
function cloudCopySql(){
  const t=cloudSQL();
  copyText(t).then(()=>toast('✅ تم نسخ سكربت SQL — الصقه في SQL Editor')).catch(()=>toast('انسخه يدويًا'));
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);
  return new Promise((res,rej)=>{try{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);res();}catch(e){rej(e);}});
}

/* ---- لوحة السحابة ---- */
function cloudBadge(){
  if(!cloudCfgOn())return '<span class="cloud-chip off">☁️ السحابة غير متظبطة</span>';
  if(cloudState==='online')return '<span class="cloud-chip on">☁️ متزامن</span>';
  if(cloudState==='connecting')return '<span class="cloud-chip wait">☁️ جاري الاتصال</span>';
  if(cloudState==='needtable')return '<span class="cloud-chip wait">☁️ محتاج جدول</span>';
  return '<span class="cloud-chip bad">☁️ خطأ</span>';
}
function cloudCfgOn(){const c=cloudCfg();return !!(c&&c.url&&c.key);}
function renderCloudPanel(){
  const st=$('#clStatus');

    const map={off:'⚪ غير موصول',connecting:'🟡 جاري الاتصال',online:'🟢 موصول ومتزامن',needtable:'🟠 موصول — ناقص إنشاء الجدول',error:'🔴 خطأ في الاتصال'};
    st.innerHTML='<b>حالة الاتصال:</b> '+(map[cloudState]||'⚪')+(cloudErr?'<div class="hint" style="color:var(--red)">'+esc(cloudErr)+'</div>':'');
  }
  const c=cloudCfg()||{};
  const u=$('#clUrl');if(u&&!u.value)u.value=c.url||'';
  const k=$('#clKey');if(k&&!k.value)k.value=c.key||'';
  cloudTouchInfo();
}
